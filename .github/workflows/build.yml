name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Restore dependencies
        run: dotnet restore Llano.slnx

      - name: Build
        run: dotnet build Llano.slnx --no-restore
